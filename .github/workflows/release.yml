name: Release

on:
  push:
    tags:
      - "v0.0.*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker-images:
    runs-on: ubuntu-latest
    needs: verify
    env:
      IMAGE_NAME: deepdaddyttv/bambuview

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Compute release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest

      - name: Build and push images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  companion-artifacts:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: companion-macos
            build_args: --mac dmg --arm64
            os: macos-14
          - artifact_name: companion-windows
            build_args: --win nsis --x64
            os: windows-latest
          - artifact_name: companion-linux
            build_args: --linux deb rpm --x64
            os: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native Companion package
        run: node scripts/package-companion.mjs ${{ matrix.build_args }}

      - name: Upload Companion artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/companion/release/*.deb
            apps/companion/release/*.dmg
            apps/companion/release/*.exe
            apps/companion/release/*.rpm
          if-no-files-found: error

  desktop-artifacts:
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: desktop-macos
            build_args: --mac dmg zip --arm64
            os: macos-14
          - artifact_name: desktop-windows-installer
            build_args: --win nsis --x64
            os: windows-latest
          - artifact_name: desktop-windows-portable
            build_args: --win dir --x64 --portable-zip
            os: windows-latest
          - artifact_name: desktop-linux
            build_args: --linux AppImage deb rpm --x64
            os: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native BambuView package
        run: node scripts/package-desktop.mjs ${{ matrix.build_args }}

      - name: Upload BambuView artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.rpm
            apps/desktop/release/*.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - docker-images
      - companion-artifacts
      - desktop-artifacts

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download native app artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: "*-*"
          path: release-artifacts

      - name: Build release notes from changelog
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          body_path: release-notes.md
          prerelease: true
          name: BambuView ${{ github.ref_name }} Alpha
