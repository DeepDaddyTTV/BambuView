<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <meta
      name="description"
      content="{{ page.description | default: site.description }}"
    />
    <link rel="stylesheet" href="{{ '/assets/docs.css' | relative_url }}" />
  </head>
  <body>
    <main class="docs-shell">
      <aside class="docs-rail" aria-label="Documentation navigation">
        <a class="docs-brand" href="{{ '/' | relative_url }}">
          <picture>
            <source
              srcset="{{ '/assets/bambuview-full-logo.webp' | relative_url }}"
              type="image/webp"
            />
            <img
              alt="BambuView"
              src="{{ '/assets/bambuview-full-logo.svg' | relative_url }}"
            />
          </picture>
        </a>
        <nav>
          <a href="{{ '/' | relative_url }}">Docs Home</a>
          <a href="{{ '/getting-started.html' | relative_url }}">
            First-Time Setup
          </a>
          <a href="{{ '/native-install.html' | relative_url }}">
            Native Install
          </a>
          <a href="{{ '/lan-mode.html' | relative_url }}">
            Bambu Connections
          </a>
          <a href="{{ '/cameras.html' | relative_url }}"> Camera Setup </a>
          <a href="{{ '/companion.html' | relative_url }}"> Companion </a>
          <a href="{{ '/prepare-slice.html' | relative_url }}">
            Prepare & Slice
          </a>
        </nav>
      </aside>
      <article class="docs-card">{{ content }}</article>
    </main>
  </body>
</html>
